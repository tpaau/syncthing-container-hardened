name: syncthing-hardened

services:
  syncthing:
    image: syncthing:latest
    # Least privileged user
    user: nobody
    ports:
      # The GUI will only be reachable from the host. If you want to manage syncthing from another
      # computer then remove the `127.0.0.1:` bit.
      - "127.0.0.1:8384:8384/tcp"
      # Sync ports are published on all host interfaces
      - "21027:21027/udp"
      - "22000:22000/tcp"
      - "22000:22000/udp"
    environment:
      - STGUIADDRESS=0.0.0.0:8384
    # Restrict certain syscalls from granting new privileges
    security_opt:
      - no-new-privileges=true
    # Drop all capabilities
    cap_drop:
      - ALL
    # And allow only those syncthing really needs to
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # Resource limits, adjust as needed.
    # This heavily depents on how you intend to use syncthing, eg. if you run it on a dedicated NAS,
    # and it's the only thing that runs there, then you should probably give it as much compute as
    # possible.
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
    volumes:
      # Bind a ~/Music directory from the host to the container
      # The nodev,noexec,nosuid part is a very important security measure. If you add any additional
      # directories here, dont forget to mount them with those options.
      - ~/Music:/var/syncthing/Music:Z,nodev,noexec,nosuid
      # Mount syncthing data directory on the host filesystem. You can remove this, but then if you
      # make any changes to the compose file all your syncthing settings will be gone.
      # Also make sure that the source container actually exists on the host.
      - ~/.local/state/syncthing-container:/var/syncthing/config:Z,nodev,noexec,nosuid
